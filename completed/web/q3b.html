<!DOCTYPE html>
<html>
<head>
<style>

.pagination{
display:flex;
justify-content: center;
align-items:center;
width:580px;
height:100px;
gap:8px;
}

a{
margin:0;
padding:15px 28px;
border-radius:10px;
color:black;
font-size:25px;
text-decoration: none;
}

a:hover{
background-color: #ddd;
}

.pagination a.active{
   background-color: #4CAF50;
   color: white;
}
.pagination a.active:hover {
   background-color: #4CAF50;
   color: white;
}

</style>
</head>
<body>
<div class="pagination">
<a href="#">&laquo;</a>
<a href="#">1</a>
<a href="#" class="active">2</a>
<a href="#">3</a>
<a href="#">4</a>
<a href="#">5</a>
<a href="#">6</a>
<a href="#">&raquo;</a>
</div>
<script>
window.onload = function() {
   let links = document.querySelectorAll('.pagination a');
for (let link of links) {
link.onclick = function(e) {
   for (let l of links) l.classList.remove('active');
           this.classList.add('active');
       }
   }
}

</script>
</body>
</html>
