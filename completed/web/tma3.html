#navlist li a {

  padding: 0;
  list-style-type: none;
  position: absolute;
  left: 0;
  top: 100%;
  z-index: 100;
}

#navlist ul li {
  display: block;
  float: none;
  width: 100%;
  margin-right: 0;
  margin-bottom: 2px;
}

#navlist ul li a {
  display: block;
  border: outset 5px #E7E3B5;

  font-size: 0.95em;
}

#navlist ul li a:hover {
  background-color: #FFEFDB;
  color: #8B4513;
  font-weight: bold;
}

#navlist li:hover > ul {

  position: absolute;
